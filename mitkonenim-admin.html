<title>Mitkonenim Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font:15px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 56px}
.logo{display:block;width:84px;height:84px;border-radius:20px;margin:0 0 6px}
#status{font-size:13px;color:#555}
#status.err{color:#000;font-weight:700}
#ver{font-size:12px;color:#888;margin-bottom:22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.stat{border:1px solid #000;border-radius:8px;padding:12px 14px}
.k{font-size:13px;color:#444}
.v{font-size:30px;font-weight:700;margin-top:2px}
h2{font-size:16px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid #000}
section{margin-bottom:24px}
.row{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{background:#e6e6e6;height:10px}
.fill{height:100%;background:#000;min-width:3px}
.num{font-variant-numeric:tabular-nums;color:#444;font-size:13px;white-space:nowrap}
.empty{color:#666;font-size:14px}
@media (min-width:560px){.stats{grid-template-columns:repeat(3,1fr)}}
#splash{position:fixed;inset:0;z-index:99;background:#fff;display:flex;align-items:center;justify-content:center;animation:fo .5s 1.8s forwards}
#splash img{width:170px;height:170px;border-radius:22%;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fo{to{opacity:0;visibility:hidden}}
</style>
</head>

<script>
/* Reads the data exactly as the app writes it:
   visitors/{uid}: {first,last,visits,device,app_version,code}
   clicks/{linkId}/{uid}: {n,last}                                  */
const $ = id => document.getElementById(id);
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e4 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : n.toLocaleString("en-US");

function bars(el, items) {
  el.textContent = "";
  if (!items.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = "No data yet"; el.appendChild(d); return; }
  const max = Math.max(...items.map(i => i.value), 1);
  for (const it of items) {
    const r = document.createElement("div"); r.className = "row";
    const n = document.createElement("div"); n.className = "name"; n.textContent = it.label; n.title = it.label;
    const t = document.createElement("div"); t.className = "track";
    const f = document.createElement("div"); f.className = "fill"; f.style.width = (it.value / max * 100) + "%"; t.appendChild(f);
    const c = document.createElement("div"); c.className = "num"; c.textContent = it.value + (it.extra ? " · " + it.extra : "");
    r.append(n, t, c); el.appendChild(r);
  }
}
const countBy = (arr, fn) => { const m = {}; arr.forEach(x => { const k = fn(x) || "unknown"; m[k] = (m[k] || 0) + 1; }); return Object.entries(m).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value); };

function render(visitors, clicks) {
  visitors = visitors || {}; clicks = clicks || {};
  const vs = Object.values(visitors);
  const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
  const D = 86400000, today = dayStart.getTime();

  $("m_total").textContent = fmt(vs.length);
  $("m_today").textContent = fmt(vs.filter(v => (v.last || 0) >= today).length);
  $("m_week").textContent = fmt(vs.filter(v => (v.last || 0) >= today - 6 * D).length);
  $("m_new").textContent = fmt(vs.filter(v => (v.first || 0) >= today).length);
  $("m_visits").textContent = fmt(vs.reduce((s, v) => s + (v.visits || 0), 0));

  let totalClicks = 0; const tiles = [], feats = [];
  for (const [id, byUser] of Object.entries(clicks)) {
    const users = Object.values(byUser || {});
    const n = users.reduce((s, u) => s + (u.n || 0), 0);
    totalClicks += n;
    const item = { label: id.replace(/^(tile|feature)_/, ""), value: n, extra: users.length + (users.length === 1 ? " person" : " people") };
    (id.startsWith("feature_") ? feats : tiles).push(item);
  }
  $("m_clicks").textContent = fmt(totalClicks);
  tiles.sort((a, b) => b.value - a.value); feats.sort((a, b) => b.value - a.value);
  bars($("tiles"), tiles); bars($("features"), feats);
  bars($("devices"), countBy(vs, v => v.device));
  bars($("versions"), countBy(vs, v => v.app_version));

  const days = [];
  for (let i = 13; i >= 0; i--) {
    const s = today - i * D;
    days.push({ label: new Date(s).toLocaleDateString(undefined, { month: "short", day: "numeric" }), value: vs.filter(v => (v.last || 0) >= s && (v.last || 0) < s + D).length });
  }
  bars($("days"), days);
}
window.render = render;
</script>
